<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>6ix Player Pathway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta name="robots" content="noindex">
<style>
:root{
  --bg:#0b0a18;--card:#15132a;--card2:#1c1a36;--line:rgba(255,255,255,.09);
  --text:#eceaf6;--muted:#9a97b3;--pink:#e040a0;--blue:#4f7dff;--green:#2fd3a0;--amber:#ffb547;--red:#ff5d6c;
  --g:linear-gradient(90deg,#e040a0,#4f7dff);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}
body{min-height:100vh;background:radial-gradient(900px 500px at 85% -10%,rgba(79,125,255,.18),transparent 60%),radial-gradient(700px 400px at -10% 0%,rgba(224,64,160,.16),transparent 60%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:16px 16px 80px}
header.top{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:6px 0 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:46px;height:46px;border-radius:50%;display:block;flex:none}
.brand h1{font:20px "Archivo Black",sans-serif;margin:0;letter-spacing:.3px}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:-2px}
.nav{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.nav button{border:0;background:none;padding:7px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px}
.nav button.on{background:var(--g);color:#fff}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:rgba(255,255,255,.18);font-size:11px;line-height:18px;margin-left:4px;text-align:center}
.btn{border:1px solid var(--line);background:var(--card2);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:rgba(255,255,255,.25)}
.btn.pri{background:var(--g);border:0;color:#fff}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:none}
.btn.danger{color:var(--red)}
.btn.danger.arm{background:var(--red);color:#fff;border-color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar .grow{flex:1;min-width:180px}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
textarea{min-height:80px;resize:vertical}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.pcard{cursor:pointer;transition:border-color .15s,transform .15s}
.pcard:hover{border-color:rgba(224,64,160,.5);transform:translateY(-1px)}
.pcard h3{margin:0 0 2px;font-size:17px}
.meta{color:var(--muted);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.07);color:#cfcce6}
.chip.prog{background:rgba(224,64,160,.16);color:#ff9fd4}
.chip.ok{background:rgba(47,211,160,.15);color:#7ff0c9}
.chip.warn{background:rgba(255,181,71,.15);color:#ffd08a}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.avg{font:24px "Archivo Black";background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty h3{color:var(--text);margin:0 0 6px}
.back{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;margin-bottom:10px;font-weight:600}
.phead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-bottom:14px}
.phead h2{font:26px "Archivo Black";margin:0}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 14px;color:var(--muted);font-weight:600;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--text);border-color:var(--pink)}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;font-size:14px}
.track{height:10px;background:rgba(255,255,255,.07);border-radius:6px;overflow:hidden}
.fill{height:100%;background:var(--g);border-radius:6px}
.delta{font-size:12px;text-align:right}
.up{color:var(--green)}.down{color:var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:720px){.two{grid-template-columns:1fr}.bar{grid-template-columns:96px 1fr 56px}}
.list{display:grid;gap:10px}
.item h4{margin:0 0 4px;font-size:15px}
.item p{margin:4px 0;font-size:14px;color:#d6d3ea;white-space:pre-wrap}
.item .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.private{border-left:3px solid var(--amber);padding-left:8px;color:#ffd08a!important}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.clips{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.clips video,.clips img{width:100%;border-radius:10px;background:#000;max-height:260px;object-fit:contain}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(5,4,14,.72);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;z-index:20}
.modal{background:var(--card);border:1px solid var(--line);border-radius:18px;width:100%;max-width:640px;padding:20px}
.modal h3{margin:0 0 4px;font:20px "Archivo Black"}
.modal .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.f{margin-bottom:12px}
.f label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.f2{grid-template-columns:1fr}}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px;position:sticky;bottom:0;background:var(--card);padding:12px 0 2px;border-top:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font:24px "Archivo Black"}
.stat span{color:var(--muted);font-size:12px}
.stat.hot b{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:left;margin:18px 0}
.step{background:var(--card2);border-radius:12px;padding:12px;font-size:13px;color:var(--muted)}
.step b{display:block;color:var(--text);font-size:14px;margin-bottom:2px}
.step i{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--g);color:#fff;font:12px "Archivo Black";font-style:normal;margin-bottom:6px}
.next{border-color:rgba(224,64,160,.45);background:linear-gradient(90deg,rgba(224,64,160,.12),rgba(79,125,255,.10));margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.next.ok{border-color:rgba(47,211,160,.35);background:rgba(47,211,160,.07)}
.next .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.quick{background:rgba(79,125,255,.08);border:1px solid rgba(79,125,255,.25);border-radius:12px;padding:12px;margin-bottom:14px}
@media(max-width:720px){input[type=text],input[type=date],input[type=search],select,textarea{font-size:16px}.btn.sm{padding:9px 12px}.stats,.steps{grid-template-columns:1fr 1fr}.actions .btn{flex:1;justify-content:center}}
.slider{display:grid;grid-template-columns:1fr 44px;gap:10px;align-items:center}
input[type=range]{width:100%;accent-color:var(--pink)}
.sval{font:18px "Archivo Black";text-align:center}
.area{background:var(--card2);border-radius:12px;padding:12px;margin-bottom:10px}
.area input[type=text]{margin-top:8px;background:var(--card)}
.guide{font-size:12px;color:var(--muted);background:rgba(79,125,255,.08);border:1px solid rgba(79,125,255,.25);border-radius:10px;padding:8px 10px;margin-bottom:12px}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick button{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.pick button.on{background:var(--g);border-color:transparent;color:#fff}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--pink)}
.auth{max-width:400px;margin:6vh auto 0}
.auth h2{font:22px "Archivo Black";margin:0 0 4px}
.auth .links{display:flex;justify-content:space-between;margin-top:12px;font-size:13px}
.auth .links button,.linkbtn{background:none;border:0;color:#8fb4ff;cursor:pointer;padding:0;font-size:13px}
input[type=password],input[type=email]{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;font-size:16px}
.kid{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.rep h4{cursor:pointer}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#24213f;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;max-width:90vw}
#toast.show{opacity:1}#toast.bad{border-color:var(--red)}
.note{background:rgba(255,181,71,.1);border:1px solid rgba(255,181,71,.3);color:#ffd08a;padding:10px 12px;border-radius:12px;font-size:14px;margin-bottom:12px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:s 0.8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px;font-weight:700}
/* ---------- command centre ---------- */
.wrap{transition:max-width .2s}
.wrap.wide{max-width:1680px}
.jarvis{position:relative;border-radius:20px;padding:18px;margin-bottom:14px;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(120deg,rgba(224,64,160,.7),rgba(79,125,255,.7)) border-box;border:1px solid transparent;box-shadow:0 0 0 1px rgba(255,255,255,.02),0 18px 60px -30px rgba(79,125,255,.55)}
.jv-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.jv-head b{font-size:16px}
.jv-head .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.orb{width:38px;height:38px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff 0,#ff9fd4 18%,var(--pink) 45%,var(--blue) 100%);box-shadow:0 0 18px rgba(224,64,160,.45)}
.orb.listen{animation:pulse 1.1s ease-in-out infinite}
.orb.think{animation:spinorb 1.4s linear infinite}
@keyframes pulse{50%{transform:scale(1.12);box-shadow:0 0 32px rgba(224,64,160,.8)}}
@keyframes spinorb{to{filter:hue-rotate(360deg)}}
.jv-head .grow{flex:1;min-width:0}
.jv-in{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:stretch}
.jv-in textarea{min-height:64px;font-size:16px;background:var(--card2)}
.jv-btns{display:flex;flex-direction:column;gap:8px}
.mic{width:56px;flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);cursor:pointer;display:grid;place-items:center;color:var(--text)}
.mic svg{width:22px;height:22px}
.mic.on{background:var(--pink);border-color:var(--pink);color:#fff;animation:pulse 1.1s ease-in-out infinite}
.partial{color:var(--muted);font-style:italic;font-size:14px;margin-top:6px;min-height:0}
.jv-ex{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.jv-ex button{border:1px dashed var(--line);background:none;color:var(--muted);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer}
.jv-ex button:hover{color:var(--text);border-color:rgba(255,255,255,.3)}
.reply{margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(79,125,255,.1);border:1px solid rgba(79,125,255,.28);font-size:15px;white-space:pre-wrap}
.plan{margin-top:10px;display:grid;gap:8px}
.act{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line)}
.act input{width:18px;height:18px;accent-color:var(--pink);margin-top:2px}
.act b{display:block;font-size:14.5px}
.act .meta{white-space:pre-wrap}
.act.off{opacity:.45}
.act .chip{margin-right:4px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.kpi b{display:block;font:26px "Archivo Black",sans-serif;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{color:var(--muted);font-size:12px}
.kpi small{display:block;color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.warn b{color:var(--amber)}.kpi.good b{color:var(--green)}.kpi.hot b{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.cc-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
.cc-side{display:grid;gap:14px;min-width:0}
.cc-grid>*{min-width:0}
.cc-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cc-h h3{margin:0;font:17px "Archivo Black",sans-serif}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:7px;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer}
.seg button.on{background:rgba(255,255,255,.1);color:var(--text)}
.calwrap{overflow-x:auto}
.week{display:grid;grid-template-columns:repeat(7,minmax(108px,1fr));gap:8px;min-width:780px}
.day{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:190px;display:flex;flex-direction:column;gap:6px;min-width:0}
.day.today{border-color:rgba(224,64,160,.6);box-shadow:inset 0 0 0 1px rgba(224,64,160,.3)}
.day.past{opacity:.78}
.dh{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.dh .dn{font:18px "Archivo Black",sans-serif;color:var(--text);letter-spacing:0}
.add{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.add:hover{background:rgba(255,255,255,.08);color:var(--text)}
.bk{text-align:left;border:1px solid var(--line);border-left:3px solid var(--blue);background:var(--card);border-radius:9px;padding:6px 8px;cursor:pointer;font-size:12.5px;line-height:1.35;width:100%;color:var(--text)}
.bk:hover{border-color:rgba(255,255,255,.25)}
.bk b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk .t{color:var(--muted);font-variant-numeric:tabular-nums}
.bk.paid{border-left-color:var(--green)}.bk.unpaid{border-left-color:var(--amber)}.bk.part{border-left-color:#ffd08a}.bk.free{border-left-color:var(--blue)}
.bk.cancelled{opacity:.5;text-decoration:line-through;border-left-color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
.dot.paid{background:var(--green)}.dot.unpaid{background:var(--amber)}.dot.part{background:#ffd08a}.dot.free{background:var(--blue)}.dot.cancelled{background:var(--muted)}
.month{display:grid;grid-template-columns:repeat(7,minmax(96px,1fr));gap:6px;min-width:700px}
.month .wd{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding:0 4px}
.mc{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px;min-height:92px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.mc.out{opacity:.4}.mc.today{border-color:rgba(224,64,160,.6)}
.mc .n{font-size:12px;font-weight:700;color:var(--muted)}
.mi{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;background:none;padding:0;text-align:left;color:var(--text);cursor:pointer}
.legend2{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.rowi{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.rowi:first-of-type{border-top:0}
.rowi .who{min-width:0}
.rowi .who b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowi .btns{display:flex;gap:6px;flex:none}
.amt{font:16px "Archivo Black",sans-serif;font-variant-numeric:tabular-nums;color:var(--amber)}
.roster{margin-top:14px}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:14px;min-width:820px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
.tbl tr:hover td{background:rgba(255,255,255,.025)}
.tbl .nm{background:none;border:0;padding:0;cursor:pointer;font-weight:700;color:var(--text);font-size:14px;text-align:left}
.tbl .nm:hover{color:#ff9fd4}
.f3{display:grid;grid-template-columns:1.3fr 1fr .8fr;gap:10px}
input[type=time]{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;color-scheme:dark}
input[type=date]{color-scheme:dark}
.attrow{display:grid;grid-template-columns:minmax(0,1.3fr) 90px auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.attrow input[type=text],.attrow select{padding:7px 9px}
.attrow .check{font-size:13px}
.mlinks{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
a.btn{text-decoration:none;color:inherit}
.bk.gcal{border-style:dashed;border-left:3px dashed #8ab4ff;background:transparent}
.bk.gcal .t::after{content:" · Google";color:#8ab4ff}
.mi.g{color:#8ab4ff;font-style:italic}
.gbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:-4px 0 12px;padding:8px 10px;border-radius:10px;background:rgba(138,180,255,.07);border:1px solid rgba(138,180,255,.2)}
.gbar .g{width:9px;height:9px;border-radius:50%;background:#8ab4ff;flex:none}
.gbar .grow{flex:1;min-width:160px}
.gbar .check{font-size:13px}
@media(max-width:1180px){.cc-grid{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:720px){.kpis{grid-template-columns:1fr 1fr}.f3{grid-template-columns:1fr 1fr}.attrow{grid-template-columns:1fr 80px;}.jv-in{grid-template-columns:1fr}.jv-btns{flex-direction:row}.mic{flex:0 0 56px}.jv-btns .btn{flex:1;justify-content:center}}
@media(prefers-reduced-motion:reduce){.orb,.mic.on{animation:none!important}}
</style>
</head>
<body>

  let g="";for(let v=0;v<=10;v+=2)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.07)"/><text x="${pl-8}" y="${y(v)+4}" fill="#9a97b3" font-size="10" text-anchor="end">${v}</text>`;
  list.forEach((a,i)=>{g+=`<text x="${x(i)}" y="${H-8}" fill="#9a97b3" font-size="10" text-anchor="middle">${esc(new Date(a.date+"T12:00:00").toLocaleDateString("en-CA",{month:"short",day:"numeric"}))}</text>`});
  AREAS.forEach(([k])=>{const pts=list.map((a,i)=>`${x(i)},${y(+a[k]||0)}`).join(" ");g+=`<polyline points="${pts}" fill="none" stroke="${COLORS[k]}" stroke-width="2.5" stroke-linejoin="round"/>`+list.map((a,i)=>`<circle cx="${x(i)}" cy="${y(+a[k]||0)}" r="3.5" fill="${COLORS[k]}"/>`).join("")});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Scores over time">${g}</svg><div class="legend">${AREAS.map(([k,l])=>`<span><i style="background:${COLORS[k]}"></i>${l}</span>`).join("")}</div>`;
}

function reportPrompt(){
  const p=player(S.modal.playerId);const start=val("rStart"),end=val("rEnd");
  const sessions=forP("sessions",p.id).filter(s=>s.date>=start&&s.date<=end).sort(byDate).map(s=>({date:s.date,focus:s.focus,drills:s.drills,went_well:s.well,work_on:s.workOn}));
  const clips=forP("clips",p.id).filter(c=>c.shared!==false&&c.date>=start&&c.date<=end).map(c=>({skill:c.tag,title:c.title,coach_comment:c.comment}));
  const [a,prev]=latestPair(p.id,end);
  const pack=x=>x?{date:x.date,average:avgOf(x),...Object.fromEntries(AREAS.map(([k])=>[k,{score:+x[k],note:x[k+"_note"]||""}])),overall:x.overall||""}:null;
  if(!sessions.length&&!a){toast("Log a session or an assessment first — Claude needs something to write from.",true);return null}
  const input=`You are writing a monthly progress report that Coach Atif Iftikhar (PCB & Cricket Australia Level 2 coach, 6ix Cricket Academy, Mississauga) will send to a young cricketer's parents.
Write in warm, specific, honest plain English for parents (Canadian spelling). Speak about the player in the third person by first name. Use ONLY the data below — never invent drills, scores, matches or events. If data is thin, keep it short rather than padding. No emojis.

PLAYER: ${JSON.stringify({first_name:(p.name||"").split(" ")[0],age_group:p.ageGroup,program:p.program,role:p.role,bats:p.batting,bowling:p.bowling,goals_and_notes:p.notes||""})}
PERIOD: ${start} to ${end}
LATEST ASSESSMENT (scores out of 10): ${JSON.stringify(pack(a))}
PREVIOUS ASSESSMENT: ${JSON.stringify(pack(prev))}
SESSIONS THIS PERIOD: ${JSON.stringify(sessions)}
VIDEO CLIPS REVIEWED: ${JSON.stringify(clips)}

Return ONLY a JSON object with exactly these keys:
{"summary": "80-130 words: what was worked on, visible progress (cite score changes if both assessments exist), attitude/effort only if the data mentions it",
 "strengths": ["3 short specific strengths"],
 "focus_areas": ["2-3 priorities for next month, each with a short why"],
 "home_drills": [{"name":"drill name","how":"one-sentence how-to a parent can supervise","dose":"e.g. 3 x 10, 3 times a week"}]  (2-3 drills, safe without a coach, linked to the focus areas)}`;
  return input;
}
function applyReply(){
  const t=val("rPaste");const m=t.match(/\{[\s\S]*\}/);let out;
  try{out=JSON.parse(m?m[0]:t)}catch(_){toast("Couldn't read that reply. Paste Claude's whole answer.",true);return}
  const arr=x=>Array.isArray(x)?x:(x?[x]:[]);
  if(out.summary)$("#rSummary").value=String(out.summary).trim();
  $("#rStrengths").value=arr(out.strengths).map(String).join("\n");
  $("#rFocus").value=arr(out.focus_areas).map(String).join("\n");
  $("#rDrills").value=arr(out.home_drills).map(d=>typeof d==="string"?d:`${d.name||"Drill"} — ${d.how||""}${d.dose?" ("+d.dose+")":""}`).join("\n");
  toast("Report filled — read it through and edit before publishing.");
}

function reportText(r){
  const p=player(r.playerId)||{};const [a,prev]=latestPair(r.playerId,r.periodEnd);
  let t=`6ix Cricket Academy — Player Progress Report\n${p.name} · ${p.ageGroup||""} · ${fmt(r.periodStart)} to ${fmt(r.periodEnd)}\n\n`;
  if(a)t+=`SCORES (out of 10, assessed ${fmt(a.date)})\n`+AREAS.map(([k,l])=>{const d=prev?(+a[k])-(+prev[k]):0;return `${l}: ${a[k]}${d?` (${d>0?"+":""}${d})`:""}`}).join("\n")+"\n\n";
  if(r.summary)t+=r.summary+"\n\n";

async function downloadPdf(r){

const addDays=(d,n)=>{const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return iso(x)};
const weekStart=d=>{const x=new Date(d+"T12:00:00");x.setDate(x.getDate()-((x.getDay()+6)%7));return iso(x)};
const wday=d=>new Date(d+"T12:00:00").toLocaleDateString("en-CA",{weekday:"short"});
const fmtLong=d=>d?new Date(d+"T12:00:00").toLocaleDateString("en-CA",{weekday:"short",month:"short",day:"numeric"}):"";
const tlabel=t=>{if(!t)return"";const [h,m]=t.split(":").map(Number);return ((h+11)%12+1)+(m?":"+String(m).padStart(2,"0"):"")+(h<12?"am":"pm")};
const pname=id=>(player(id)||{}).name||"Removed player";
const rateOf=id=>+((player(id)||{}).rate)||0;
const first=s=>String(s||"").trim().split(/\s+/)[0]||"";
const att=b=>Array.isArray(b&&b.attendees)?b.attendees:[];
const bSorted=()=>S.bookings.slice().sort((a,b)=>((a.date||"")+(a.start||"")).localeCompare((b.date||"")+(b.start||"")));
const live=b=>b.status!=="cancelled";
function payState(b){if(!live(b))return"cancelled";const due=att(b).filter(a=>+a.fee>0);if(!due.length)return"free";const n=due.filter(a=>a.paid).length;return n===due.length?"paid":n?"part":"unpaid"}
function bTitle(b){const ns=att(b).map(a=>first(pname(a.playerId)));return b.title||(ns.length?(ns.length>3?ns.slice(0,3).join(", ")+" +"+(ns.length-3):ns.join(", ")):b.kind||"Session")}
function owed(){const o=[];S.bookings.forEach(b=>{if(!live(b)||(b.date||"")>today())return;att(b).forEach((a,i)=>{if(!a.paid&&+a.fee>0)o.push({b,a,i})})});return o.sort((x,y)=>x.b.date.localeCompare(y.b.date))}
const sessFor=(bid,pid)=>S.sessions.find(s=>s.bookingId===bid&&s.playerId===pid);
function toSend(){
  const out=[];
  S.sessions.filter(s=>!s.sentAt&&s.date>=daysAgo(14)&&player(s.playerId)).forEach(s=>out.push({type:"session",date:s.date,pid:s.playerId,id:s.id}));
  S.reports.filter(r=>r.status==="published"&&!r.sentAt&&player(r.playerId)).forEach(r=>out.push({type:"report",date:r.periodEnd,pid:r.playerId,id:r.id}));
  return out.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
}
function findPlayer(name){

}

const G={events:[],status:"off",err:"",at:0,key:"",all:false,push:true,armImp:null,timer:null,busy:false,setup:false};
try{G.all=localStorage.getItem("cc_gall")==="1";G.push=localStorage.getItem("cc_gpush")!=="0"}catch(_){}
const COACH_RE=/\b(1\s*(on|-|:|x)\s*1|one[- ]on[- ]one|1-1|cricket|coaching|nets?|academy|batting|bowling|fielding|keeping|training|lesson|session|camp|trials?|6ix|cardinal)\b/i;
function calRange(){const a=C.anchor||today();
  if(C.mode==="month"){const m0=a.slice(0,7)+"-01";const last=addDays(addDays(m0,32).slice(0,7)+"-01",-1);return [weekStart(m0),addDays(weekStart(last),6)]}
  const ws=weekStart(a);return [ws,addDays(ws,6)]}
const gPlayers=t=>active().filter(p=>{const f=first(p.name);return f.length>1&&new RegExp("\\b"+f.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i").test(t)});
const gIsCoach=e=>COACH_RE.test(e.title)||gPlayers(e.title).length>0;
const gImported=e=>S.bookings.some(b=>b.gcalId===e.id||(b.gcalPushed&&!b.gcalId&&b.date===e.date&&b.start===e.start));
const gShown=d=>G.status!=="ok"?[]:G.events.filter(e=>e.date===d&&!gImported(e)&&(G.all||gIsCoach(e)));
function gGuess(t){const m=t.match(/\bwith\s+([A-Z][a-zA-Z'-]+(?:\s+[A-Z][a-zA-Z'-]+)?)/)||t.match(/^([A-Z][a-zA-Z'-]+)(?:'s)?\s*[-:·]?\s*(?:1\s*(?:on|-|:|x)\s*1|one[- ]on[- ]one|session|lesson|nets|coaching)\b/i);return m?m[1]:""}
function gToBooking(g){const ps=gPlayers(g.title);const kind=/academy/i.test(g.title)?"Academy":/group|camp|squad|nets|Udd/i.test(g.title)||ps.length>1?"Group":"1-on-1";
  return {date:g.date,start:g.start,mins:g.mins||60,kind,location:g.location,title:ps.length?"":g.title,status:"booked",gcalId:g.id,_gTitle:g.title,_newName:ps.length?"":gGuess(g.title),attendees:ps.map(p=>({playerId:p.id,fee:rateOf(p.id),paid:false,method:""}))}}
async function fnCall(name,body){
  const {data,error}=await S.sb.functions.invoke(name,{body});
  if(error){let code="error";try{const b=await error.context.json();code=b.error||code}catch(_){}throw {code}}
  if(data&&data.error)throw {code:data.error};
  return data||{};
}
async function gFetch(force){
  const [s,e]=calRange(),key=s+"|"+e;
  if(!force&&key===G.key)return;
  G.key=key;G.armImp=null;if(G.busy)return;G.busy=true;
  if(G.status==="off"||force&&G.status!=="ok")G.status="loading";
  try{const d=await fnCall("pp-calendar",{start:s,end:e});G.events=Array.isArray(d.events)?d.events:[];G.status="ok";G.err="";G.at=Date.now()}
  catch(err){const c=err&&err.code||"error";if(["no_url","bad_url","feed_gone","not_coach"].includes(c)){G.status=c;G.events=[]}else if(G.status==="ok")G.err=c;else G.status="failed"}
  finally{G.busy=false;if(key!==G.key)G.key="";if(S.view==="command"&&S.isCoach)renderMain()}
}
function gWatch(){gFetch(false);if(!G.timer)G.timer=setInterval(()=>{if(S.view==="command"&&S.isCoach&&!document.hidden&&!S.modal)gFetch(true)},300000)}
async function gAllow(){G.status="loading";renderMain();await gFetch(true)}
async function gSave(btn){
  const v=val("gUrl");
  if(!/^https:\/\/calendar\.google\.com\/calendar\/ical\/.+\.ics/.test(v)){toast("Paste the secret address in iCal format. It starts with https://calendar.google.com/calendar/ical/ and ends in .ics",true);return}
  btn.disabled=true;
  const {error}=await S.sb.from("pp_coach_settings").upsert({key:"ics_url",value:v,updated_at:new Date().toISOString()});
  btn.disabled=false;
  if(error){toast("Couldn't save the address ("+error.message+").",true);return}
  G.setup=false;toast("Calendar connected.");await gAllow();
}
function gBar(){
  const s=G.status;const dot=`<span class="g"></span>`;
  const setupForm=(msg)=>`<div class="gbar" style="display:block">${dot} <b style="color:var(--text)">${msg}</b>
    <ol class="meta" style="margin:8px 0 10px 18px;padding:0">
      <li>Open Google Calendar on a computer and go to Settings.</li>

    <p class="meta" style="margin:8px 0 0">Keep this address private: anyone with it can read your calendar. Only your coach login can see it here.</p></div>`;
  if(s==="not_coach")return "";

  if(s==="off"||s==="loading")return `<div class="gbar">${dot}<span class="grow"><span class="spin"></span> Loading Google Calendar…</span></div>`;
  if(s==="no_url")return setupForm("Connect your Google Calendar");

  if(s==="feed_gone")return setupForm("Google stopped accepting the saved address. It may have been reset");

  const [a,b]=calRange();const todo=G.events.filter(e=>e.date>=a&&e.date<=b&&!gImported(e)&&gIsCoach(e)&&(gPlayers(e.title).length||gGuess(e.title)));
  return `<div class="gbar">${dot}<span class="grow">Google Calendar synced at ${new Date(G.at).toLocaleTimeString("en-CA",{hour:"numeric",minute:"2-digit"})}${G.err?" · last refresh failed, showing earlier events":""} · Dashed cards are calendar events not booked here yet.</span>

    <button class="btn sm ghost" data-act="gAllow" title="Refresh">Refresh</button><button class="btn sm ghost" data-act="gSetup">Change calendar</button></div>`;
}
async function gImportAll(btn){
  btn.disabled=true;btn.innerHTML=`<span class="spin"></span> Importing…`;
  const [a,b]=calRange();let n=0;const made={};
  for(const g of G.events.filter(e=>e.date>=a&&e.date<=b&&!gImported(e)&&gIsCoach(e))){
    const bk=gToBooking(g);
    if(!bk.attendees.length&&bk._newName){const k=bk._newName.toLowerCase();let pid=made[k];
      if(!pid){const ex=findPlayer(bk._newName);pid=ex&&ex.name.toLowerCase()===k?ex.id:await save("players",null,{name:bk._newName,program:"1-on-1",active:true});made[k]=pid}
      if(pid){bk.attendees=[{playerId:pid,fee:rateOf(pid),paid:false,method:""}];bk.title=""}}
    if(!bk.attendees.length)continue;
    delete bk._gTitle;delete bk._newName;

}
function gLink(b){
  const ns=att(b).map(a=>pname(a.playerId)).join(", ");

{"type":"log","player":"name","date":"","focus":[zero or more of ${JSON.stringify(TAGS)}],"drills":"","well":"","workOn":"","privateNote":"","fee":null,"paid":null,"method":""}
{"type":"paid","player":"name","date":null,"amount":null,"method":"E-transfer|Cash|Card|Other|"}
{"type":"cancel","player":"name or null","date":"","start":""}
{"type":"add_player","name":"","ageGroup":"","program":"","role":"","parentName":"","parentEmail":"","parentPhone":"","notes":""}
{"type":"update_player","player":"name","fields":{"parentName":"","parentEmail":"","parentPhone":"","ageGroup":"","program":"","role":"","notes":"","rate":null}}
("rate" is the player's usual fee per session. If a booking or log has no fee stated, leave "fee" null and the player's usual_fee is used.)`;

function resolvePlan(acts){
  const newNames=new Set(S.players.map(p=>(p.name||"").toLowerCase()));
  acts.filter(a=>a&&a.type==="add_player"&&a.name).forEach(a=>newNames.add(String(a.name).toLowerCase()));
  const who=n=>{const p=findPlayer(n);return p?{pid:p.id,name:p.name,isNew:false}:{pid:null,name:String(n||"").trim(),isNew:true}};
  return acts.map(a=>{
    const x={a,on:true,bad:false,chips:[],sub:"",label:""};
    if(a.type==="book"){
      x.people=(a.players||[]).filter(Boolean).map(who);
      x.label=`Book ${a.kind||"1-on-1"} · ${x.people.map(p=>p.name).join(", ")||"no players"} · ${fmtLong(a.date)}${a.start?" "+tlabel(a.start):""}`;
      x.sub=[a.mins?a.mins+" min":"",a.fee?money(a.fee)+" per player":"No fee given",a.location||"",a.title||""].filter(Boolean).join(" · ");
      x.people.filter(p=>p.isNew).forEach(p=>x.chips.push(["New player: "+p.name,"warn"]));
      if(!a.date){x.bad=true;x.chips.push(["Missing date","warn"])}
    }else if(a.type==="log"){
      x.p=who(a.player);
      x.label=`Log session · ${x.p.name} · ${fmtLong(a.date||today())}`;
      x.sub=[a.focus&&a.focus.length?"Focus: "+a.focus.join(", "):"",a.drills?"Worked on: "+a.drills:"",a.well?"Went well: "+a.well:"",a.workOn?"Next: "+a.workOn:"",a.privateNote?"Private: "+a.privateNote:""].filter(Boolean).join("\n");
      const b=S.bookings.find(b=>live(b)&&b.date===(a.date||today())&&x.p.pid&&att(b).some(z=>z.playerId===x.p.pid));
      x.chips.push(b?["Linked to the "+(b.start?tlabel(b.start)+" ":"")+"booking"]:["Adds it to the schedule"]);
      if(a.paid)x.chips.push(["Paid "+(a.fee?money(a.fee):"")+(a.method?" by "+a.method:""),"ok"]);
      if(x.p.isNew)x.chips.push(["New player: "+x.p.name,"warn"]);
    }else if(a.type==="paid"){
      x.p=who(a.player);
      const o=owed().filter(z=>z.a.playerId===x.p.pid);const fut=bSorted().filter(b=>live(b)&&b.date>today()).flatMap(b=>att(b).map((z,i)=>({b,a:z,i}))).filter(z=>z.a.playerId===x.p.pid&&!z.a.paid);
      x.hit=(a.date&&[...o,...fut].find(z=>z.b.date===a.date))||o[0]||fut[0]||null;
      x.label=`Mark paid · ${x.p.name}${a.amount?" · "+money(a.amount):""}${a.method?" · "+a.method:""}`;
      if(x.hit)x.sub=`For the ${fmtLong(x.hit.b.date)} session (${money(x.hit.a.fee||a.amount)})`;
      else{x.bad=true;x.chips.push([x.p.isNew?"Player not found":"No unpaid session found","warn"])}
    }else if(a.type==="cancel"){
      x.p=a.player?who(a.player):null;
      x.hit=S.bookings.find(b=>live(b)&&b.date===a.date&&(!a.start||b.start===a.start)&&(!x.p||att(b).some(z=>z.playerId===x.p.pid)));
      x.label=`Cancel · ${x.hit?bTitle(x.hit):(x.p?x.p.name:"booking")} · ${fmtLong(a.date)}${x.hit&&x.hit.start?" "+tlabel(x.hit.start):""}`;
      if(!x.hit){x.bad=true;x.chips.push(["No matching booking","warn"])}
    }else if(a.type==="add_player"){
      const ex=findPlayer(a.name);
      x.label=`Add player · ${a.name||"?"}`;x.sub=[a.ageGroup,a.program,a.role,a.parentName&&"Parent: "+a.parentName,a.parentEmail,a.parentPhone].filter(Boolean).join(" · ");
      if(!a.name){x.bad=true}else if(ex&&ex.name.toLowerCase()===String(a.name).toLowerCase()){x.bad=true;x.chips.push(["Already on your list","warn"])}
    }else if(a.type==="update_player"){
      x.p=who(a.player);const f=a.fields||{};x.fields=Object.fromEntries(Object.entries(f).filter(([k,v])=>v&&["parentName","parentEmail","parentPhone","ageGroup","program","role","notes","rate"].includes(k)).map(([k,v])=>[k,k==="rate"?+String(v).replace(/[^\d.]/g,"")||0:v]));
      x.label=`Update ${x.p.name}`;x.sub=Object.entries(x.fields).map(([k,v])=>`${k.replace(/([A-Z])/g," $1").toLowerCase()}: ${v}`).join(" · ");
      if(x.p.isNew||!Object.keys(x.fields).length){x.bad=true;x.chips.push([x.p.isNew?"Player not found":"Nothing to change","warn"])}
    }else{x.bad=true;x.label="Unrecognised action"}
    return x});
}
async function jApply(btn){

    const ex=findPlayer(p.name);if(ex&&ex.name.toLowerCase()===k)return ex.id;
    const id=await save("players",null,{name:p.name,program:"1-on-1",ageGroup:"",active:true,...(extra||{})});made[k]=id;return id};
  for(const x of C.plan.filter(x=>x.on&&!x.bad)){const a=x.a;
    try{
      if(a.type==="add_player"){const d={name:a.name,program:PROGRAMS.includes(a.program)?a.program:"1-on-1",ageGroup:AGES.includes(a.ageGroup)?a.ageGroup:"",role:ROLES.includes(a.role)?a.role:"",parentName:a.parentName||"",parentEmail:a.parentEmail||"",parentPhone:a.parentPhone||"",notes:a.notes||"",active:true};
        const id=await save("players",null,d);if(id){made[a.name.toLowerCase()]=id;n++}}
      else if(a.type==="book"){const ids=[];for(const p of x.people){const id=await pidOf(p);if(id)ids.push(id)}
        const bd={date:a.date,start:a.start||"",mins:+a.mins||60,kind:KINDS.includes(a.kind)?a.kind:(ids.length>1?"Group":"1-on-1"),title:a.title||"",location:a.location||"",status:"booked",notes:"",attendees:ids.map(id=>({playerId:id,fee:+a.fee||rateOf(id),paid:false,method:""}))};
        const bid=await save("bookings",null,bd);if(bid)n++}
      else if(a.type==="log"){const pid=await pidOf(x.p);if(!pid)continue;const date=a.date||today();
        let b=S.bookings.find(b=>live(b)&&b.date===date&&att(b).some(z=>z.playerId===pid));let bid=b&&b.id;
        const pay=a.paid?{paid:true,method:a.method||"",paidOn:today()}:{};
        if(!b)bid=await save("bookings",null,{date,start:"",mins:60,kind:"1-on-1",title:"",location:"",status:"done",notes:"",attendees:[{playerId:pid,fee:+a.fee||rateOf(pid),paid:false,method:"",...pay}]});
        else{const list=att(b).map(z=>z.playerId===pid?{...z,...(!+z.fee&&(+a.fee||rateOf(pid))?{fee:+a.fee||rateOf(pid)}:{}),...pay}:z);await save("bookings",b.id,{attendees:list,status:"done"})}
        const d={playerId:pid,date,focus:(a.focus||[]).filter(t=>TAGS.includes(t)),drills:a.drills||"",well:a.well||"",workOn:a.workOn||"",privateNote:a.privateNote||"",bookingId:bid||""};
        const sid=await save("sessions",null,d);if(sid){logged.push({...d,id:sid});n++}}
      else if(a.type==="paid"){const h=x.hit;const fee=+h.a.fee||+a.amount||0;
        if(await setAttendee(h.b.id,h.i,{paid:true,method:a.method||h.a.method||"",paidOn:today(),fee,...(a.amount&&+a.amount!==fee?{paidAmount:+a.amount}:{})}))n++}
      else if(a.type==="cancel"){if(await save("bookings",x.hit.id,{status:"cancelled"}))n++}
      else if(a.type==="update_player"){if(await save("players",x.p.pid,x.fields))n++}
    }catch(err){toast("One change didn't save: "+x.label,true)}
  }
  C.plan=null;C.done=logged;$("#jIn").value="";
  toast(n?`Saved ${n} change${n===1?"":"s"}.`:"Nothing was saved.",!n);
  renderMain();
}

  if(t.id==="q"){S.q=t.value;$("#plist").innerHTML=playerList()}
  if(t.dataset.act==="slide"){const k=t.id.slice(2);$("#v_"+k).textContent=t.value}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="fProg"){S.fProg=t.value;$("#plist").innerHTML=playerList()}
  if(t.id==="fAge"){S.fAge=t.value;$("#plist").innerHTML=playerList()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.modal)closeModal();if(e.key==="Enter"&&!S.user&&/^au/.test(e.target.id||"")){const b=document.querySelector('[data-act="authGo"]');if(b)b.click()}});
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]");
  if(S.armed&&!(el&&el.dataset.act==="del")){S.armed=null;renderMain()}
  if(!el)return;
  const act=el.dataset.act,id=el.dataset.id;
  if(act==="scrim"){if(e.target===el)closeModal();return}
  if(act!=="open"&&el.closest(".pcard")&&act!=="logSession"){}
  switch(act){
    case "view":S.view=el.dataset.v;S.pid=null;renderAll();window.scrollTo(0,0);break;
    case "open":S.view="player";S.pid=id;S.tab="overview";renderAll();window.scrollTo(0,0);break;
    case "tab":S.tab=el.dataset.t;renderMain();break;
    case "close":closeModal();break;
    case "newPlayer":playerForm();break;
    case "editPlayer":playerForm(player(id));break;
    case "savePlayer":{
      const d={name:val("pName"),program:val("pProg"),ageGroup:val("pAge"),role:val("pRole"),dob:val("pDob"),batting:val("pBat"),bowling:val("pBowl"),parentName:val("pParent"),parentEmail:val("pEmail").toLowerCase(),parentEmail2:val("pEmail2").toLowerCase(),accessActive:$("#pAccess").checked,parentPhone:val("pPhone"),rate:+val("pRate").replace(/[^\d.]/g,"")||null,notes:val("pNotes"),active:true};
      if(!d.name){toast("Add the player's name.",true);return}
      el.disabled=true;const nid=await save("players",id||null,d);el.disabled=false;
      if(nid){closeModal();toast(id?"Player updated.":"Player added.");if(!id){S.view="player";S.pid=nid;S.tab="overview";renderAll()}}
      break}
    case "logSession":e.stopPropagation();sessionForm(id);break;
    case "editSession":sessionForm(S.pid,S.sessions.find(x=>x.id===id));break;
    case "pick":{const v=el.dataset.v;focusPick=focusPick.includes(v)?focusPick.filter(x=>x!==v):[...focusPick,v];el.classList.toggle("on");break}
    case "sortNote":{
      const t=val("sQuick");if(!t){toast("Type or dictate a quick note first.",true);return}
      el.disabled=true;el.innerHTML=`<span class="spin"></span> Sorting…`;
      try{
        const o=await S.sample.json(`A cricket coach wrote this quick note after a training session. Sort it into fields using ONLY what the note says; leave a field as "" if the note doesn't cover it. Keep the coach's wording, tidy it lightly.\nNOTE: ${JSON.stringify(t)}\nReturn ONLY JSON: {"focus": [zero or more of ${JSON.stringify(TAGS)}], "drills": "", "went_well": "", "work_on": ""}`,{modelTier:"quick"});
        if(o.drills)$("#sDrills").value=o.drills;if(o.went_well)$("#sWell").value=o.went_well;if(o.work_on)$("#sWork").value=o.work_on;
        focusPick=(Array.isArray(o.focus)?o.focus:[]).filter(x=>TAGS.includes(x));
        document.querySelectorAll("#sFocus button").forEach(b=>b.classList.toggle("on",focusPick.includes(b.dataset.v)));
        toast("Sorted — check the fields, then save.");
      }catch(err){toast(err&&err.code==="not_granted"?"Claude access wasn't allowed — fill the fields by hand.":"Couldn't sort the note — fill the fields by hand.",true)}
      finally{if(document.body.contains(el)){el.disabled=false;el.textContent="✨ Sort into fields"}}
      break}
    case "saveSession":{
      const d={playerId:el.dataset.pid,date:val("sDate")||today(),focus:focusPick,drills:val("sDrills"),well:val("sWell"),workOn:val("sWork"),privateNote:val("sPriv")};
      if(el.dataset.bid)d.bookingId=el.dataset.bid;
      el.disabled=true;const ok=await save("sessions",id||null,d);el.disabled=false;
      if(ok){closeModal();
        if(d.bookingId){const b=S.bookings.find(x=>x.id===d.bookingId);if(b&&b.status==="booked")await save("bookings",b.id,{status:"done"})}
        if(!id){toast("Session logged. Send the update to the parent?");sendSessionForm({...d,id:ok})}else toast("Session updated.")}
      break}
    case "newAssess":assessForm();break;
    case "editAssess":assessForm(S.assessments.find(x=>x.id===id));break;
    case "saveAssess":{
      const d={playerId:S.pid,date:val("aDate")||today(),overall:val("aOverall")};
      AREAS.forEach(([k])=>{d[k]=+document.getElementById("a_"+k).value;d[k+"_note"]=val("n_"+k)});
      el.disabled=true;const ok=await save("assessments",id||null,d);el.disabled=false;if(ok){closeModal();toast("Assessment saved.");S.tab="overview";renderMain()}break}
    case "newClip":if(!S.assets){toast("Uploads aren't available in this view.",true);return}clipForm();break;
    case "editClip":clipForm(S.clips.find(x=>x.id===id));break;
    case "saveClip":{
      const d={playerId:S.pid,title:val("cTitle"),tag:val("cTag"),comment:val("cComment"),shared:$("#cShared").checked};
      if(id){el.disabled=true;const ok=await save("clips",id,d);el.disabled=false;if(ok){closeModal();toast("Clip updated.")}return}
      const f=$("#cFile").files[0];if(!f){toast("Choose a video or photo.",true);return}
      if(f.size>50*1024*1024){toast(`That file is ${(f.size/1048576).toFixed(0)} MB — the limit is 50 MB. Trim it or film at 720p.`,true);return}
      el.disabled=true;el.innerHTML=`<span class="spin"></span> Uploading…`;
      try{const up=await S.assets.upload(f);
        const ok=await save("clips",null,{...d,title:d.title||f.name.replace(/\.[^.]+$/,""),date:today(),path:up.id,contentType:up.contentType||f.type,sizeBytes:up.sizeBytes||f.size});
        if(ok){closeModal();toast("Clip uploaded.")}else{try{await S.assets.delete(up.id)}catch(_){}}}
      catch(err){toast("Upload failed ("+(err&&err.code||err&&err.message||"error")+").",true)}
      finally{if(document.body.contains(el)){el.disabled=false;el.textContent="Upload"}}
      break}
    case "newReport":case "newReportFor":{
      const pid=act==="newReportFor"?id:S.pid;reportForm({playerId:pid,periodStart:daysAgo(30),periodEnd:today(),status:"draft"});break}
    case "editReport":reportForm(S.reports.find(x=>x.id===id));break;
    case "copyPrompt":{const t=reportPrompt();if(!t)return;try{await navigator.clipboard.writeText(t);toast("Prompt copied — paste it into a Claude chat.")}catch(_){toast("Couldn't copy.",true)}break}
    case "applyReply":applyReply();break;
    case "aiDraftP":{const t=reportPrompt();if(!t)return;el.disabled=true;el.innerHTML=`<span class="spin"></span> Drafting…`;
      try{const out=await S.sample.json(t);$("#rPaste").value=JSON.stringify(out);applyReply()}catch(err){toast(aiMsg(err),true)}
      finally{if(document.body.contains(el)){el.disabled=false;el.textContent="Draft it now"}}break}
    case "authMode":S.auth=el.dataset.m;S.authMsg="";S.authDirty=true;renderAll();break;
    case "authGo":S.authDirty=true;authGo(el);break;
    case "signOut":await S.sb.auth.signOut();break;
    case "kid":S.kid=id;S.openRep=null;renderMain();break;
    case "openRep":S.openRep=S.openRep===id?"none":id;renderMain();break;
    case "toggleAccess":{const p=player(id);if(!p.accessActive&&!p.parentEmail){toast("Add the parent's email first (Edit).",true);return}const was=p.accessActive;const ok=await save("players",id,{accessActive:!was});if(ok)toast(was?"Portal access is off.":"Portal access is on for "+(p.parentEmail||"this family")+".");break}
    case "saveReport":{el.disabled=true;const r=await saveReportForm();el.disabled=false;if(r){closeModal();toast(r.status==="published"?"Published — the parent can see it now.":"Draft saved.")}break}
    case "pdfFromForm":{el.disabled=true;const r=await saveReportForm();el.disabled=false;if(r)downloadPdf(r);break}
    case "pdf":downloadPdf(S.reports.find(x=>x.id===id));break;
    case "copyReport":{
      const r=S.modal&&S.modal.type==="report"?{...reportFromForm()}:S.reports.find(x=>x.id===id);
      try{await navigator.clipboard.writeText(reportText(r));toast("Report text copied — paste it into WhatsApp or email.")}catch(_){toast("Couldn't copy — select the text and copy it by hand.",true)}
      break}
    case "del":{
      e.stopPropagation();const col=el.dataset.col,k=col+":"+id;
      if(S.armed!==k){S.armed=k;renderMain();return}
      S.armed=null;
      if(col==="players"){
        for(const c of ["assessments","sessions","clips","reports"])for(const x of forP(c,id)){if(c==="clips"&&x.path&&S.assets){try{await S.assets.delete(x.path)}catch(_){}}await remove(c,x.id)}
        if(await remove("players",id)){S.view="players";S.pid=null;toast("Player deleted.")}
      }else{
        const x=S[col].find(z=>z.id===id);
        if(col==="clips"&&x&&x.path&&S.assets){try{await S.assets.delete(x.path)}catch(_){}}
        if(await remove(col,id))toast("Deleted.");
      }
      renderAll();break}
  }
});
</script>
</body>
</html>
